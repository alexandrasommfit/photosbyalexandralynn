<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Page not found | Photos by Alexandra Lynn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root { --navy: #15232B; --blue: #8FB2C4; --cream: #F7F5F1; --ink: #2B3540; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; background: var(--cream); color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 300; line-height: 1.75; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); color: var(--navy); line-height: 1.1; margin-bottom: 1rem; }
    p { max-width: 460px; margin: 0 auto 2rem; }
    a.btn { display: inline-block; font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; padding: .9rem 2.2rem; background: var(--blue); color: var(--navy); border: 1px solid var(--blue); text-decoration: none; }
    a.btn:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
    a:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; box-shadow: 0 0 0 5px #fff; }
  </style>
</head>
<body>
  <main>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for doesn't exist. Head back to the homepage, or get in touch if you were looking for something specific.</p>
    <a class="btn" href="/">Back to home</a>
  </main>
</body>
</html>
